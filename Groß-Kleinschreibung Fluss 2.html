<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Rechtschreibung – mit Grammatik</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      background: linear-gradient(145deg, #1a3a5f, #0e2a3a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      width: 100%;
      background: #fef7e8;
      border-radius: 64px;
      padding: 1.5rem 2rem 2rem;
      box-shadow: 0 25px 40px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 2rem;
      color: #ffd966;
      text-shadow: 3px 3px 0 #b45f1b;
      margin: 0;
      cursor: pointer;
    }
    .topic-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .topic-btn {
      background: #2c5530;
      border: none;
      padding: 10px 20px;
      border-radius: 60px;
      font-weight: bold;
      color: #ffefb9;
      cursor: pointer;
      box-shadow: 0 4px 0 #1a3a1a;
      transition: transform 0.1s, box-shadow 0.1s;
      font-size: 0.9rem;
    }
    .topic-btn.active {
      background: #f5c542;
      color: #1a3a1a;
      box-shadow: 0 4px 0 #b45f1b;
    }
    .topic-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1a3a1a; }

    .sentence-area {
      background: #f2e5c2;
      border-radius: 48px;
      padding: 24px 20px;
      margin-bottom: 30px;
      border: 2px solid #ffcf8a;
    }
    .sentence {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 6px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #2c2b1a;
    }
    .word-unit {
      display: inline-flex;
      align-items: center;
      background: #fff5e6;
      padding: 4px 12px;
      border-radius: 56px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .gap-btn {
      background: #ffefbf;
      border: 3px solid #ca9622;
      border-radius: 48px;
      font-size: 1.2rem;
      font-weight: bold;
      font-family: monospace;
      min-width: 65px;
      text-align: center;
      padding: 4px 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #8b5a2b;
      color: #2c2b26;
    }
    .gap-btn.active {
      background: #ffeaa0;
      border-color: #f0a500;
      box-shadow: 0 0 0 3px #ffdd99, 0 4px 0 #b16217;
      transform: scale(1.02);
    }
    .gap-btn.completed {
      background: #b5d8a5;
      border-color: #3f7849;
      box-shadow: 0 2px 0 #2c5a2e;
      cursor: default;
    }
    .rest-word {
      font-size: 1.4rem;
      font-weight: 600;
      padding: 0 4px;
      color: #2f3e2e;
    }

    .river {
      background: linear-gradient(135deg, #2c5a3a, #1a3e24);
      border-radius: 60px;
      padding: 15px 8px;
      margin-top: 15px;
      border: 3px solid #f5c542;
      position: relative;
      overflow: hidden;
      height: 200px;
    }
    .river-title {
      text-align: center;
      font-weight: bold;
      color: #fff0a3;
      margin-bottom: 8px;
      font-size: 1.1rem;
      background: rgba(0,0,0,0.3);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      padding: 0 18px;
      border-radius: 60px;
    }
    .letter-pool {
      position: relative;
      width: 100%;
      height: 150px;
    }
    .floating-card {
      position: absolute;
      background: #fff2cf;
      width: 75px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      font-family: monospace;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 6px 0 #8b5a2b;
      border: 2px solid #ffc285;
      transition: transform 0.05s linear;
      will-change: transform, left;
      z-index: 20;
    }
    .floating-card:hover { transform: scale(1.05); background: #ffffe0; }
    .floating-card:active { transform: scale(0.96); }
    .flying-card {
      position: fixed;
      z-index: 2000;
      font-size: 1.8rem;
      font-weight: bold;
      background: #ffeaa7;
      border-radius: 50%;
      width: 65px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 20px black;
      pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.4, 1), opacity 0.25s;
      opacity: 0.9;
    }
    .info-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      gap: 15px;
      flex-wrap: wrap;
    }
    .score-box {
      background: #2d2b1f;
      padding: 6px 18px;
      border-radius: 50px;
      color: #f9e2a1;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .message-area {
      background: #fae8c0;
      border-radius: 40px;
      padding: 6px 22px;
      font-weight: bold;
      color: #b64926;
      flex: 1;
      text-align: center;
      font-size: 0.85rem;
      min-height: 3rem;
    }
    button.next-btn {
      background: #5fa7f0;
      border: none;
      padding: 8px 20px;
      border-radius: 60px;
      font-weight: bold;
      font-size: 0.9rem;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 0 #2c5282;
    }
    button.next-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2c5282; }
    @media (max-width: 700px) {
      .container { padding: 1rem; }
      .gap-btn, .rest-word { font-size: 1rem; }
      .gap-btn { min-width: 55px; }
      .floating-card { width: 60px; height: 60px; font-size: 1.4rem; }
      .river { height: 180px; }
      .sentence { font-size: 1rem; }
      .header { flex-direction: column; align-items: stretch; }
      .topic-selector { justify-content: center; }
      .topic-btn { font-size: 0.8rem; padding: 8px 14px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="mainTitle">📚 Rechtschreibung</h1>
    <div class="topic-selector" id="topicSelector"></div>
  </div>

  <div class="sentence-area"><div id="sentenceDisplay" class="sentence"></div></div>
  <div class="river"><div class="river-title">🌊 Buchstaben‑Fluss</div><div id="letterRiver" class="letter-pool"></div></div>

  <div class="info-panel">
    <div class="score-box">📖 Satz <span id="satzCounter">1</span> / <span id="totalSätze">∞</span></div>
    <div id="gameMessage" class="message-area">✨ Klicke eine Lücke an, dann den passenden Buchstaben</div>
    <button id="nextSentenceBtn" class="next-btn">⏩ Nächster</button>
  </div>
</div>

<script>
  // ==============================================================
  // KORREKTE DEUTSCHE GRAMMATIK – SUBJEKT, PRÄDIKAT, OBJEKT
  // ==============================================================

  // ---------- NOMEN MIT ARTIKEL (Genus) ----------
  const NOMEN_MASKULIN = [
    { nom: "Hund", artikel: "der" },
    { nom: "Mann", artikel: "der" },
    { nom: "Tisch", artikel: "der" },
    { nom: "Baum", artikel: "der" },
    { nom: "Berg", artikel: "der" },
    { nom: "Fluss", artikel: "der" },
    { nom: "Wald", artikel: "der" },
    { nom: "Tag", artikel: "der" },
    { nom: "Abend", artikel: "der" },
    { nom: "Morgen", artikel: "der" },
    { nom: "Winter", artikel: "der" },
    { nom: "Sommer", artikel: "der" },
    { nom: "Vater", artikel: "der" },
    { nom: "Bruder", artikel: "der" },
    { nom: "Freund", artikel: "der" }
  ];

  const NOMEN_FEMININ = [
    { nom: "Katze", artikel: "die" },
    { nom: "Frau", artikel: "die" },
    { nom: "Sonne", artikel: "die" },
    { nom: "Blume", artikel: "die" },
    { nom: "Schule", artikel: "die" },
    { nom: "Stadt", artikel: "die" },
    { nom: "Wiese", artikel: "die" },
    { nom: "Nacht", artikel: "die" },
    { nom: "Küche", artikel: "die" },
    { nom: "Tür", artikel: "die" },
    { nom: "Mutter", artikel: "die" },
    { nom: "Schwester", artikel: "die" },
    { nom: "Freundin", artikel: "die" },
    { nom: "Hoffnung", artikel: "die" },
    { nom: "Liebe", artikel: "die" },
    { nom: "Freiheit", artikel: "die" },
    { nom: "Verantwortung", artikel: "die" },
    { nom: "Gerechtigkeit", artikel: "die" }
  ];

  const NOMEN_NEUTRUM = [
    { nom: "Haus", artikel: "das" },
    { nom: "Auto", artikel: "das" },
    { nom: "Kind", artikel: "das" },
    { nom: "Buch", artikel: "das" },
    { nom: "Bett", artikel: "das" },
    { nom: "Feld", artikel: "das" },
    { nom: "Leben", artikel: "das" },
    { nom: "Zimmer", artikel: "das" },
    { nom: "Fenster", artikel: "das" },
    { nom: "Jahr", artikel: "das" },
    { nom: "Gefühl", artikel: "das" },
    { nom: "Glück", artikel: "das" },
    { nom: "Vertrauen", artikel: "das" },
    { nom: "Schwimmbad", artikel: "das" }
  ];

  // ALLE NOMEN (für die Großschreibung)
  const ALLE_NOMEN_GROSS = [
    ...NOMEN_MASKULIN.map(n => n.nom.toLowerCase()),
    ...NOMEN_FEMININ.map(n => n.nom.toLowerCase()),
    ...NOMEN_NEUTRUM.map(n => n.nom.toLowerCase())
  ];

  // ---------- VERBEN (3. Person Singular) ----------
  const VERBEN_3SING = [
    "läuft", "geht", "kommt", "sieht", "hört", "spricht", "denkt", "fühlt",
    "liebt", "hasst", "hofft", "fürchtet", "glaubt", "weiß", "kennt",
    "schläft", "träumt", "lacht", "weint", "singt", "tanzt", "arbeitet",
    "lernt", "liest", "schreibt", "zeichnet", "baut", "repariert",
    "kocht", "backt", "spült", "wäscht", "räumt", "putzt"
  ];

  // ---------- ADJEKTIVE ----------
  const ADJEKTIVE = [
    "groß", "klein", "wichtig", "gefährlich", "schön", "gut", "böse", "wahr", "falsch",
    "neu", "alt", "jung", "schnell", "langsam", "hell", "dunkel", "warm", "kalt",
    "laut", "leise", "klar", "trüb", "leicht", "schwer", "glücklich", "traurig",
    "mutig", "ängstlich", "stolz", "bescheiden", "weise", "klug", "dumm"
  ];

  // ---------- PRÄPOSITIONEN + ARTIKEL (für Adverbiale) ----------
  const PRAEPOSITIONEN = [
    { p: "in", artikel: "dem" },
    { p: "auf", artikel: "dem" },
    { p: "unter", artikel: "dem" },
    { p: "über", artikel: "dem" },
    { p: "neben", artikel: "dem" },
    { p: "hinter", artikel: "dem" },
    { p: "vor", artikel: "dem" },
    { p: "zwischen", artikel: "den" }
  ];

  const PRAEP_NOMEN_NEUTRAL = ["Garten", "Haus", "Zimmer", "Feld", "Wald", "Schwimmbad"];

  // ---------- HILFSFUNKTIONEN ----------
  function randomElement(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function capitalize(word) {
    return word.charAt(0).toUpperCase() + word.slice(1);
  }

  function getNomenWithArtikel() {
    const alle = [...NOMEN_MASKULIN, ...NOMEN_FEMININ, ...NOMEN_NEUTRUM];
    return randomElement(alle);
  }

  // ---------- GRAMMATIK-ENGINE: Erzeugt einen korrekten Satz ----------
  function generateGrammaticalSentence() {
    const subjekt = getNomenWithArtikel();
    const subjektWort = subjekt.nom;
    const artikelSubj = subjekt.artikel;
    const verb = randomElement(VERBEN_3SING);
    let objekt = getNomenWithArtikel();
    while (objekt.nom === subjektWort) {
      objekt = getNomenWithArtikel();
    }
    const objektWort = objekt.nom;
    let artikelObj = objekt.artikel;
    if (objekt.artikel === "der") artikelObj = "den";
    const adj = randomElement(ADJEKTIVE);

    const muster = [
      () => `${artikelSubj} ${subjektWort} ${verb} ${artikelObj} ${objektWort}.`,
      () => `${artikelSubj} ${subjektWort} ${verb} ${adj} ${artikelObj} ${objektWort}.`,
      () => {
        const praep = randomElement(PRAEPOSITIONEN);
        const praepNomen = randomElement(PRAEP_NOMEN_NEUTRAL);
        return `${artikelSubj} ${subjektWort} ${verb} ${praep.p} ${praep.artikel} ${praepNomen}.`;
      },
      () => {
        const praep = randomElement(PRAEPOSITIONEN);
        const praepNomen = randomElement(PRAEP_NOMEN_NEUTRAL);
        return `${artikelSubj} ${subjektWort} ${verb} ${artikelObj} ${objektWort} ${praep.p} ${praep.artikel} ${praepNomen}.`;
      }
    ];

    const satzString = randomElement(muster)();
    const wordArray = satzString.split(' ');

    return wordArray.map((w, i) => {
      const lower = w.toLowerCase().replace(/[,.]/g, '');
      const isFirst = (i === 0);
      const isNoun = ALLE_NOMEN_GROSS.includes(lower);
      if (isFirst || isNoun) {
        const punctuation = w.match(/[,.]$/);
        const base = w.replace(/[,.]$/, '');
        const capped = capitalize(base);
        return punctuation ? capped + punctuation[0] : capped;
      }
      return w;
    });
  }

  // ---------- TOPIC 0: Grammatik-Zufallssätze ----------
  function generateCapitalizationSentence() {
    return generateGrammaticalSentence();
  }

  // ---------- TOPIC 1: Einfache Sätze (mit Doppelkonsonanten) ----------
  const EINFACHE_SENTENCES = [
    { words: ["Die", "Sonne", "scheint", "heute", "warm."] },
    { words: ["Der", "Mann", "geht", "jeden", "Tag", "spazieren."] },
    { words: ["Die", "Mutter", "backt", "einen", "Kuchen."] },
    { words: ["Die", "Kinder", "schlafen", "tief", "und", "fest."] },
    { words: ["Der", "Ball", "rollt", "über", "das", "Feld."] },
    { words: ["Ein", "voller", "Eimer", "steht", "dort."] },
    { words: ["Das", "Schwimmbad", "macht", "großen", "Spaß."] },
    { words: ["Das", "Bett", "ist", "weich", "und", "gemütlich."] },
    { words: ["Die", "Bienen", "sammeln", "fleißig", "Honig."] },
    { words: ["Die", "Sammlung", "alter", "Briefmarken", "ist", "wertvoll."] },
    { words: ["Das", "Fell", "des", "Hundes", "ist", "weich."] },
    { words: ["Die", "Massen", "von", "Menschen", "strömen", "herein."] },
    { words: ["Der", "Pfeffer", "ist", "sehr", "scharf."] },
    { words: ["Das", "Kippen", "ist", "auf", "dem", "Boden", "verboten."] },
    { words: ["Der", "Roller", "fährt", "schnell", "die", "Straße", "runter."] }
  ];
  let einfachIdx = 0;
  function generateEinfacheSentence() {
    const sentence = EINFACHE_SENTENCES[einfachIdx % EINFACHE_SENTENCES.length];
    einfachIdx++;
    return [...sentence.words];
  }

  // ---------- TOPIC 2: Abstrakte Nomen mit Grammatik ----------
  function generateAbstractSentence() {
    const ABSTRACT_NOMEN = [
      "Angst", "Freude", "Trauer", "Wut", "Liebe", "Hass", "Neid", "Stolz",
      "Scham", "Hoffnung", "Verzweiflung", "Einsamkeit", "Geborgenheit",
      "Sehnsucht", "Zufriedenheit", "Glück", "Enttäuschung", "Überraschung",
      "Meinung", "Gedanke", "Idee", "Plan", "Entscheidung", "Überlegung",
      "Vorstellung", "Erinnerung", "Traum", "Zweifel", "Glaube", "Wissen",
      "Verstand", "Intuition", "Vermutung", "Mut", "Stärke", "Schwäche",
      "Geduld", "Fleiß", "Faulheit", "Ehrlichkeit", "Lüge", "Toleranz",
      "Respekt", "Vertrauen", "Sicherheit", "Gefahr", "Freiheit",
      "Verantwortung", "Pflicht", "Recht", "Gerechtigkeit", "Ruhe", "Unruhe",
      "Stille", "Lärm", "Ordnung", "Chaos", "Frieden", "Krieg", "Gesundheit",
      "Krankheit", "Reichtum", "Armut", "Erfolg", "Scheitern", "Leben", "Tod"
    ];

    const subjektWort = randomElement(ABSTRACT_NOMEN);
    let artikel = "das";
    const feminin = ["Angst", "Freude", "Trauer", "Wut", "Liebe", "Hass", "Neid", "Scham", "Hoffnung", "Verzweiflung", "Einsamkeit", "Geborgenheit", "Sehnsucht", "Zufriedenheit", "Enttäuschung", "Überraschung", "Meinung", "Entscheidung", "Vorstellung", "Erinnerung", "Geduld", "Faulheit", "Ehrlichkeit", "Lüge", "Toleranz", "Sicherheit", "Gefahr", "Freiheit", "Verantwortung", "Pflicht", "Gerechtigkeit", "Ruhe", "Unruhe", "Stille", "Ordnung", "Gesundheit", "Krankheit", "Armut", "Hoffnung"];
    const maskulin = ["Gedanke", "Plan", "Glaube", "Wissen", "Verstand", "Respekt", "Frieden", "Krieg", "Reichtum", "Erfolg", "Mut", "Zweifel", "Traum", "Lärm", "Chaos", "Tod"];
    const neutrum = ["Glück", "Vertrauen", "Gefühl", "Leben", "Scheitern", "Recht"];

    if (feminin.includes(subjektWort)) artikel = "die";
    else if (maskulin.includes(subjektWort)) artikel = "der";
    else artikel = "das";

    const verb = randomElement(VERBEN_3SING);
    const objekt = getNomenWithArtikel();
    let objektArtikel = objekt.artikel;
    if (objekt.artikel === "der") objektArtikel = "den";
    const adj = randomElement(ADJEKTIVE);

    const muster = [
      () => `${artikel} ${subjektWort} ${verb} ${objektArtikel} ${objekt.nom}.`,
      () => `${artikel} ${subjektWort} ${verb} ${adj} ${objektArtikel} ${objekt.nom}.`
    ];

    const satzString = randomElement(muster)();
    return satzString.split(' ');
  }

  // ==============================================================
  // APP-LOGIK (unverändert)
  // ==============================================================

  let currentTopic = 0;
  let currentWords = [];
  let gapsData = [];
  let activeGapIndex = -1;
  let floatingElements = [];
  let msgTimeout = null;

  const sentenceDiv = document.getElementById("sentenceDisplay");
  const riverContainer = document.getElementById("letterRiver");
  const satzCounterSpan = document.getElementById("satzCounter");
  const totalSätzeSpan = document.getElementById("totalSätze");
  const messageDiv = document.getElementById("gameMessage");
  const nextBtn = document.getElementById("nextSentenceBtn");
  const topicSelector = document.getElementById("topicSelector");

  function generateSentence(topic) {
    if (topic === 0) return generateCapitalizationSentence();
    if (topic === 1) return generateEinfacheSentence();
    if (topic === 2) return generateAbstractSentence();
    return ["Fehler", "Unbekanntes", "Thema."];
  }

  // ---------- Rendern (unverändert) ----------
  function renderSentence() {
    const wordArray = generateSentence(currentTopic);
    currentWords = wordArray;
    sentenceDiv.innerHTML = '';
    gapsData = [];

    wordArray.forEach((word, idx) => {
      const requiredLetter = word[0];
      const restWord = word.slice(1);
      const displayLetter = requiredLetter.toLowerCase();

      const wordUnit = document.createElement('div');
      wordUnit.className = 'word-unit';

      const gapBtn = document.createElement('button');
      gapBtn.className = 'gap-btn';
      gapBtn.innerText = displayLetter;
      gapBtn.setAttribute('data-word-idx', idx);
      gapBtn.addEventListener('click', (e) => onGapClick(idx, e));
      wordUnit.appendChild(gapBtn);

      const restSpan = document.createElement('span');
      restSpan.className = 'rest-word';
      restSpan.innerText = restWord;
      wordUnit.appendChild(restSpan);

      sentenceDiv.appendChild(wordUnit);
      if (idx !== wordArray.length - 1) {
        const space = document.createElement('span');
        space.className = 'rest-word';
        space.innerText = ' ';
        sentenceDiv.appendChild(space);
      }

      gapsData.push({
        wordIdx: idx,
        currentDisplay: displayLetter,
        requiredLetter: requiredLetter,
        completed: false,
        remainingWord: restWord
      });
    });

    activeGapIndex = -1;
    updateActiveGap();
    const riverCards = generateRiverLetters();
    startRiver(riverCards);
    nextBtn.style.background = "#5fa7f0";
    satzCounterSpan.innerText = currentTopic === 1 ? (einfachIdx) : "∞";
    totalSätzeSpan.innerText = currentTopic === 1 ? EINFACHE_SENTENCES.length : "∞";
  }

  // ---------- Fluss-Logik (unverändert) ----------
  function showMessage(msg, isError = false) {
    if (msgTimeout) clearTimeout(msgTimeout);
    messageDiv.innerText = msg;
    messageDiv.style.backgroundColor = isError ? "#ffcab3" : "#f1e5c0";
    messageDiv.style.color = isError ? "#b33a1a" : "#2c5a2e";
    msgTimeout = setTimeout(() => {
      messageDiv.style.backgroundColor = "#fae8c0";
      messageDiv.style.color = "#b64926";
      if (activeGapIndex !== -1 && gapsData[activeGapIndex] && !gapsData[activeGapIndex].completed) {
        messageDiv.innerText = `🎯 Lücke: '${gapsData[activeGapIndex].currentDisplay}' → benötigt '${gapsData[activeGapIndex].requiredLetter}'`;
      } else if (!allGapsCompleted()) {
        messageDiv.innerText = "🐟 Klicke eine Lücke an, dann den passenden Buchstaben";
      } else {
        messageDiv.innerText = "✅ Satz gelöst! Weiter mit 'Nächster Satz'";
      }
    }, 2500);
  }

  function allGapsCompleted() { return gapsData.every(g => g.completed === true); }

  function updateActiveGap() {
    document.querySelectorAll('.gap-btn').forEach(btn => btn.classList.remove('active'));
    const pendingIdx = gapsData.findIndex(g => !g.completed);
    if (pendingIdx !== -1) {
      activeGapIndex = pendingIdx;
      const btn = document.querySelector(`.gap-btn[data-word-idx="${pendingIdx}"]`);
      if (btn) btn.classList.add('active');
      const gap = gapsData[pendingIdx];
      messageDiv.innerText = `🔍 Lücke: '${gap.currentDisplay}' → benötigt '${gap.requiredLetter}'`;
    } else {
      activeGapIndex = -1;
      if (allGapsCompleted()) messageDiv.innerText = "🎉 Glückwunsch! Satz komplett!";
    }
  }

  function onGapClick(gapIdx, e) {
    if (gapsData[gapIdx].completed) { showMessage("Diese Lücke ist schon richtig!", false); return; }
    if (activeGapIndex !== -1) {
      const oldBtn = document.querySelector(`.gap-btn[data-word-idx="${activeGapIndex}"]`);
      if (oldBtn) oldBtn.classList.remove('active');
    }
    activeGapIndex = gapIdx;
    const newBtn = document.querySelector(`.gap-btn[data-word-idx="${gapIdx}"]`);
    if (newBtn) newBtn.classList.add('active');
    const gap = gapsData[gapIdx];
    showMessage(`✨ Lücke: '${gap.currentDisplay}' → wähle '${gap.requiredLetter}'`, false);
  }

  function animateAndFill(targetGapBtn, floatingCard, letter, onComplete) {
    const rectCard = floatingCard.getBoundingClientRect();
    const rectTarget = targetGapBtn.getBoundingClientRect();
    const flyer = document.createElement('div');
    flyer.className = 'flying-card';
    flyer.innerText = letter;
    flyer.style.left = rectCard.left + rectCard.width/2 - 32 + 'px';
    flyer.style.top = rectCard.top + rectCard.height/2 - 32 + 'px';
    document.body.appendChild(flyer);
    const deltaX = rectTarget.left + rectTarget.width/2 - 32 - (rectCard.left + rectCard.width/2 - 32);
    const deltaY = rectTarget.top + rectTarget.height/2 - 32 - (rectCard.top + rectCard.height/2 - 32);
    flyer.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.6)`;
    flyer.style.opacity = '0.4';
    setTimeout(() => { flyer.remove(); if (onComplete) onComplete(); }, 320);
  }

  function onFloatingCardClick(letter, element) {
    if (activeGapIndex === -1) { showMessage("❗ Erst eine Lücke antippen, dann den Buchstaben auswählen!", true); return; }
    const activeGap = gapsData[activeGapIndex];
    if (activeGap.completed) { showMessage("Diese Lücke ist schon gefüllt. Wähle eine andere Lücke.", true); return; }
    const required = activeGap.requiredLetter;
    if (letter !== required) {
      showMessage(`❌ Falsch! '${letter}' ist nicht richtig. Versuch's nochmal!`, true);
      element.style.transform = "scale(0.9)";
      setTimeout(() => { if (element) element.style.transform = ""; }, 150);
      return;
    }
    const targetGapBtn = document.querySelector(`.gap-btn[data-word-idx="${activeGapIndex}"]`);
    if (!targetGapBtn) return;
    const idx = floatingElements.findIndex(f => f.element === element);
    if (idx !== -1) { element.remove(); floatingElements.splice(idx, 1); }
    animateAndFill(targetGapBtn, element, letter, () => {
      activeGap.completed = true;
      const fullWord = letter + activeGap.remainingWord;
      targetGapBtn.innerText = fullWord;
      targetGapBtn.classList.remove('active');
      targetGapBtn.classList.add('completed');
      updateActiveGap();
      if (allGapsCompleted()) {
        showMessage("🏆✅ Richtig! Satz gelöst! Weiter zum nächsten Satz.", false);
        nextBtn.style.background = "#4cbb17";
      } else {
        const next = gapsData.find(g => !g.completed);
        if (next) showMessage(`✅ Richtig! Nächste Lücke: '${next.currentDisplay}' → benötigt '${next.requiredLetter}'`, false);
      }
    });
  }

  function generateRiverLetters() {
    const cards = [];
    for (let gap of gapsData) {
      if (!gap.completed) {
        const required = gap.requiredLetter;
        cards.push(required);
        const opposite = required === required.toUpperCase() ? required.toLowerCase() : required.toUpperCase();
        cards.push(opposite);
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzäöüß";
        let randomOther = alphabet[Math.floor(Math.random() * alphabet.length)];
        cards.push(randomOther);
      }
    }
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    return cards.slice(0, 20);
  }

  function startRiver(cardsArray) {
    riverContainer.innerHTML = '';
    floatingElements = [];
    const tracks = [15, 55, 95, 135, 175];
    cardsArray.forEach((cardText, idx) => {
      const card = document.createElement('div');
      card.className = 'floating-card';
      card.innerText = cardText;
      const track = tracks[idx % tracks.length];
      const duration = 6 + Math.random() * 6;
      const delay = Math.random() * 5;
      card.style.top = track + 'px';
      card.style.left = '100%';
      card.style.animation = `slideRightToLeft ${duration}s linear ${delay}s infinite`;
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        onFloatingCardClick(cardText, card);
      });
      riverContainer.appendChild(card);
      floatingElements.push({ element: card, letter: cardText });
    });
  }

  if (!document.querySelector('#riverAnim')) {
    const style = document.createElement('style');
    style.id = 'riverAnim';
    style.textContent = `
      @keyframes slideRightToLeft {
        0% { transform: translateX(0); left: 100%; visibility: visible; }
        100% { transform: translateX(-150%); left: 0%; visibility: visible; }
      }
      .floating-card { position: absolute; will-change: transform, left; visibility: visible; }
      .letter-pool { position: relative; height: 100%; overflow: visible; }
      .river { overflow-x: hidden; overflow-y: visible; }
    `;
    document.head.appendChild(style);
  }

  function goToNextSentence() {
    if (floatingElements.length) { floatingElements.forEach(f => f.element.remove()); floatingElements = []; }
    renderSentence();
    showMessage(`✨ Neuer Satz!`, false);
  }

  // ---------- Themenwechsel ----------
  function switchTopic(topicIdx) {
    currentTopic = topicIdx;
    einfachIdx = 0;
    if (floatingElements.length) { floatingElements.forEach(f => f.element.remove()); floatingElements = []; }
    renderSentence();
    satzCounterSpan.innerText = currentTopic === 1 ? "1" : "∞";
    document.querySelectorAll('.topic-btn').forEach((btn, i) => {
      btn.classList.toggle('active', i === topicIdx);
    });
    const topicNames = ["📝 Grammatik-Sätze", "📝 Einfache Sätze", "🎲 Abstrakte Nomen"];
    messageDiv.innerText = `📚 Thema gewechselt: ${topicNames[topicIdx]}`;
  }

  // ---------- Buttons ----------
  const topics = [
    { name: "Grammatik-Sätze", icon: "📝" },
    { name: "Einfache Sätze", icon: "📝" },
    { name: "Abstrakte Nomen", icon: "🎲" }
  ];

  topics.forEach((topic, index) => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (index === 0 ? ' active' : '');
    btn.innerText = topic.icon + ' ' + topic.name;
    btn.setAttribute('data-topic', index);
    btn.addEventListener('click', () => { switchTopic(index); });
    topicSelector.appendChild(btn);
  });

  // ---------- Event-Listener ----------
  nextBtn.addEventListener('click', () => {
    if (!allGapsCompleted()) {
      if (confirm("Du hast noch nicht alle Lücken gelöst. Trotzdem zum nächsten Satz? Fortschritt geht verloren.")) {
        goToNextSentence();
      }
    } else {
      goToNextSentence();
    }
  });

  document.getElementById('mainTitle').addEventListener('click', () => { switchTopic(0); });

  // ---------- Start ----------
  renderSentence();
  satzCounterSpan.innerText = "1";
</script>
</body>
</html>
